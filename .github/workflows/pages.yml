# מפרסם את גרסת הדפדפן ב-GitHub Pages (ענף gh-pages) בכל דחיפה ל-main.
# הכתובת: https://yosi014h-jpg.github.io/kulmus/
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: touch dist/web/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/web
          publish_branch: gh-pages
          force_orphan: true
