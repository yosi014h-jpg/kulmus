# בונה את תוכנת ההתקנה ומפרסם אותה ב-Releases בכל פעם שמספר הגרסה ב-package.json משתנה.
# אם הפרסום נכשל בשגיאת שרת זמנית של GitHub — שינוי בקובץ הזה מריץ אותו מחדש (ניסיון חוזר).
# הקישורים הקבועים להורדה של הגרסה האחרונה:
#   https://github.com/yosi014h-jpg/kulmus/releases/latest/download/KulmusPDF-Setup-x64.exe
#   https://github.com/yosi014h-jpg/kulmus/releases/latest/download/KulmusPDF.apk
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.v.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Build installer
        if: steps.v.outputs.exists == 'false'
        run: |
          npm ci
          npm test
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          installer/build.sh x64
          cp "dist/KulmusPDF-Setup-${{ steps.v.outputs.version }}-x64.exe" dist/KulmusPDF-Setup-x64.exe

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: קולמוס PDF ${{ steps.v.outputs.version }}
          make_latest: true
          # הערות אוטומטיות כבוי: יצירתן נכשלה בשגיאת שרת 500 של GitHub
          body: "קולמוס PDF ${{ steps.v.outputs.version }} — Windows (KulmusPDF-Setup-x64.exe) ואנדרואיד (KulmusPDF.apk)."
          # קובץ אחד בלבד (כ-117MB): העלאה כפולה של אותו קובץ נכשלה בשרתי GitHub
          files: dist/KulmusPDF-Setup-x64.exe

  # אפליקציית אנדרואיד (APK) — נבנית אחרי Windows ומתווספת לאותו Release.
  build-android:
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        env:
          KULMUS_KEYSTORE_B64: ${{ secrets.KULMUS_KEYSTORE_B64 }}
          KULMUS_KEYSTORE_PASSWORD: ${{ secrets.KULMUS_KEYSTORE_PASSWORD }}
        run: |
          # המפתח הפרטי מגיע רק מהסודות של המאגר; בלי מפתח לא מפרסמים APK
          if [ -z "$KULMUS_KEYSTORE_B64" ] || [ -z "$KULMUS_KEYSTORE_PASSWORD" ]; then
            echo "::error::חסרים הסודות KULMUS_KEYSTORE_B64 / KULMUS_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          export KULMUS_KEYSTORE="$RUNNER_TEMP/kulmus.jks"
          echo "$KULMUS_KEYSTORE_B64" | base64 -d > "$KULMUS_KEYSTORE"
          npm ci
          npm run build:android
          cd android && ./gradlew assembleRelease --no-daemon
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk dist/KulmusPDF.apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist/KulmusPDF-${{ needs.build.outputs.version }}.apk"
          rm -f "$KULMUS_KEYSTORE"

      - name: Add to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: |
            dist/KulmusPDF.apk
            dist/KulmusPDF-${{ needs.build.outputs.version }}.apk
