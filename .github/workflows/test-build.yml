# גרסת בדיקה: כל דחיפה לענף שאינו main בונה תוכנת התקנה — בלי לפרסם אותה.
# ההורדה: לשונית Actions ← הריצה האחרונה ← Artifacts ← KulmusPDF-test (Windows) / KulmusPDF-test-android (אנדרואיד)
name: Test build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build test installer
        run: |
          npm ci
          npm test
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          installer/build.sh x64
          VERSION=$(node -p "require('./package.json').version")
          SHORT=$(git rev-parse --short HEAD)
          mkdir -p out
          cp "dist/KulmusPDF-Setup-$VERSION-x64.exe" "out/KulmusPDF-Setup-$VERSION-test-$SHORT.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: KulmusPDF-test
          path: out/*.exe
          retention-days: 14
          compression-level: 0

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build test APK
        run: |
          npm ci
          npm run build:android
          cd android && ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KulmusPDF-test-android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
